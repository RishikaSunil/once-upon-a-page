<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login · Once Upon a Page</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="64x64" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/logo.png') }}">

    <!-- Google Fonts: Cinzel Decorative, Playfair Display, Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom Admin CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-login-body">

    <div class="admin-login-card">
        
        <div class="text-center mb-4">
            <div class="mb-2">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Once Upon a Page" style="height: 64px; width: 64px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(120, 90, 160, 0.25)); display: inline-block;">
            </div>
            <h2 class="admin-login-brand mb-1">Once Upon a Page</h2>
            <p class="text-muted small">Administration Portal · Restricted Access</p>
        </div>

        <!-- Flash Notification Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-3">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3 small py-2 px-3" role="alert">
                            <span>{{ message }}</span>
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST" novalidate>
            <div class="mb-3">
                <label for="adminEmail" class="form-label small text-white-50 fw-bold">Admin Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0 text-white-50"><i class="fa-solid fa-envelope"></i></span>
                    <input 
                        type="email" 
                        class="form-control admin-login-input" 
                        id="adminEmail" 
                        name="email" 
                        placeholder="admin@onceuponapage.com" 
                        value="{{ email or '' }}" 
                        required 
                        autocomplete="email">
                </div>
            </div>

            <div class="mb-4">
                <label for="adminPassword" class="form-label small text-white-50 fw-bold">Master Passphrase</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-0 text-white-50"><i class="fa-solid fa-lock"></i></span>
                    <input 
                        type="password" 
                        class="form-control admin-login-input" 
                        id="adminPassword" 
                        name="password" 
                        placeholder="Enter master password" 
                        required 
                        autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn btn-admin-primary w-100 py-2 fs-6">
                <i class="fa-solid fa-key me-2"></i> Access Administration Panel
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top border-white border-opacity-10">
            <a href="{{ url_for('dashboard') }}" class="text-white-50 small text-decoration-none">
                <i class="fa-solid fa-arrow-left me-1"></i> Return to Reader Library
            </a>
        </div>

    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Subtle Magical Click/Tap Sparkle Effect -->
    <script src="{{ url_for('static', filename='js/sparkle.js') }}" defer></script>
</body>
</html>
